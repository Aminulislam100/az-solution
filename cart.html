<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - AZ Solution</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2 sticky-top">
        <div class="container">
            <a class="navbar-brand fs-5 fw-bold d-flex align-items-center" href="index.html">
                <img src="images/logo1.png" alt="Logo" style="height: 34px; margin-right: 10px;">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="Tools.html">Employee Tools</a></li>
                </ul>
                <a href="cart.html" class="btn btn-dark btn-sm position-relative rounded-pill px-3">
                    <i class="fas fa-shopping-bag me-1"></i> Cart
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- কার্ট কনটেন্ট -->
    <div class="container my-5 flex-grow-1">
        <h2 class="mb-4">
            <i class="fas fa-shopping-bag text-primary"></i> Shopping Cart
        </h2>

        <div class="row">
            <!-- বাম পাশে আইটেম টেবিল -->
            <div class="col-lg-8 mb-4">
                <div class="table-responsive bg-white border rounded p-3">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items">
                            <!-- JavaScript দিয়ে আইটেম বসবে -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ডান পাশে Order Summary -->
            <div class="col-lg-4">
                <div class="card border">
                    <div class="card-body">
                        <h5 class="card-title border-bottom pb-3 mb-4">Order Summary</h5>

                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Subtotal</span>
                            <span id="subtotal">৳ 0</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Delivery Charge</span>
                            <span id="delivery-charge">৳ 150</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">
                            <strong class="fs-5">Total Amount</strong>
                            <strong class="text-danger fs-5" id="total-amount-display">৳ 0</strong>
                        </div>

                        <!-- রিয়েল Google Form (Hidden iframe-এ সাবমিট হবে) -->
                        <form id="checkout-form" 
                              action="https://docs.google.com/forms/d/e/1FAIpQLSfqXc1ygkfc3p_R5k_B765oI_1vLDomBwkb0t37OH9nm8Ycaw/formResponse" 
                              method="POST" 
                              target="hidden_iframe" 
                              onsubmit="handleCheckout(event);">
                            
                            <div class="bg-light p-3 rounded mb-4 border">
                                <h6 class="mb-3">Customer Information</h6>
                                
                                <div class="mb-2">
                                    <input type="text" id="customer-name" name="entry.1238205756" class="form-control" placeholder="Your Name" required>
                                </div>
                                <div class="mb-2">
                                    <input type="text" id="customer-phone" name="entry.1401504436" class="form-control" placeholder="Phone Number" required>
                                </div>
                                <div class="mb-2">
                                    <textarea id="customer-address" name="entry.1560914417" class="form-control" placeholder="Delivery Address" rows="2" required></textarea>
                                </div>

                                <!-- লুকানো ইনপুট ফিল্ড (ঠিক করা entry ID সহ) -->
                                <input type="hidden" id="order-details-input" name="entry.1861320470">
                                <input type="hidden" id="total-amount-input" name="entry.1548961090">
                            </div>

                            <button type="submit" id="checkout-btn" class="btn btn-success w-100 btn-lg">
                                <i class="fas fa-check-circle"></i> Proceed to Checkout
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden iframe -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { formSubmittedAction(); }"></iframe>

    <!-- Footer -->
    <footer class="bg-secondary text-center py-2 mt-auto">
        <div class="container text-white">
            <div class="d-flex justify-content-center align-items-center gap-2">
                <strong>Proprietor:</strong>
                <a href="https://sites.google.com/view/amin10k/"><img src="images/amin.gif" alt="Aminul Islam" style="height: 28px; width: 188px; object-fit: cover; border-radius: 50%;"></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let submitted = false;
        let finalWhatsappURL = "";

        function updateCartUI() {
            const cartCountElement = document.getElementById('cart-count');
            if (cartCountElement) {
                let totalItems = 0;
                for (let i = 0; i < cart.length; i++) {
                    totalItems += cart[i].quantity;
                }
                cartCountElement.innerText = totalItems;
            }

            const cartItemsElement = document.getElementById('cart-items');
            
            if (cartItemsElement) {
                cartItemsElement.innerHTML = "";   
                
                let subtotal = 0;
                const deliveryCharge = 150;

                if (cart.length === 0) {
                    cartItemsElement.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">
                                Your cart is empty. Please add some products.
                            </td>
                        </tr>
                    `;
                    
                    document.getElementById('subtotal').innerText = "৳ 0";
                    document.getElementById('total-amount-display').innerText = "৳ 0";
                    document.getElementById('delivery-charge').innerText = "৳ 0";
                    document.getElementById('checkout-btn').disabled = true;
                    return;
                }

                document.getElementById('checkout-btn').disabled = false;
                document.getElementById('delivery-charge').innerText = "৳ " + deliveryCharge;

                let orderDetailsText = "";
                
                for (let i = 0; i < cart.length; i++) {
                    const item = cart[i];
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;

                    orderDetailsText += (i + 1) + ". " + item.name + " - " + item.quantity + " pcs (৳ " + itemTotal + ")\n";

                    const row = `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="${item.img}" width="50" class="rounded me-3" alt="${item.name}">
                                    <h6 class="mb-0">${item.name}</h6>
                                </div>
                            </td>
                            <td>৳ ${item.price}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <button type="button" class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${i}, -1)">-</button>
                                    <span class="mx-3 fw-bold">${item.quantity}</span>
                                    <button type="button" class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${i}, 1)">+</button>
                                </div>
                            </td>
                            <td class="fw-bold">৳ ${itemTotal}</td>
                            <td>
                                <button type="button" class="btn btn-sm btn-danger" onclick="removeItem(${i})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    
                    cartItemsElement.innerHTML += row;
                }

                const totalAmount = subtotal + deliveryCharge;

                document.getElementById('subtotal').innerText = "৳ " + subtotal;
                document.getElementById('total-amount-display').innerText = "৳ " + totalAmount;

                document.getElementById('order-details-input').value = orderDetailsText;
                document.getElementById('total-amount-input').value = totalAmount;
            }
        }

        function changeQuantity(index, amount) {
            cart[index].quantity += amount;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function handleCheckout(event) {
            if (cart.length === 0) {
                event.preventDefault();
                alert("Your cart is empty!");
                return;
            }

            const customerName = document.getElementById('customer-name').value.trim();
            const customerPhone = document.getElementById('customer-phone').value.trim();
            const customerAddress = document.getElementById('customer-address').value.trim();
            const orderDetailsText = document.getElementById('order-details-input').value;
            const totalAmount = document.getElementById('total-amount-input').value;
            
            let whatsappMessage = "*New Order from AZ Solution*\n\n";
            whatsappMessage += "*Customer Details:*\nName: " + customerName + "\nPhone: " + customerPhone + "\nAddress: " + customerAddress + "\n\n";
            whatsappMessage += "*Order Items:*\n" + orderDetailsText + "\n";
            whatsappMessage += "*Total Amount: ৳ " + totalAmount + "*\n\nPlease confirm my order.";

            const whatsappNumber = "8801871122883"; 
            finalWhatsappURL = "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(whatsappMessage);

            const checkoutBtn = document.getElementById('checkout-btn');
            checkoutBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            submitted = true; 
        }

        function formSubmittedAction() {
            window.open(finalWhatsappURL, '_blank'); 

            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
            
            document.getElementById('checkout-form').reset();
            updateCartUI();

            const checkoutBtn = document.getElementById('checkout-btn');
            checkoutBtn.innerHTML = '<i class="fas fa-check-circle"></i> Proceed to Checkout';
            
            submitted = false;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateCartUI();
        });
    </script>
</body>
</html>
