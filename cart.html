<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - AZ Solution</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2 sticky-top">
        <div class="container">
        <a class="navbar-brand fs-5 fw-bold d-flex align-items-center" href="index.html">
            <img src="images/logo1.png" alt="Logo" style="height: 34px; margin-right: 10px;">
        </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="Tools.html">Employee Tools</a></li>
                </ul>
                <a href="cart.html" class="btn btn-dark btn-sm position-relative rounded-pill px-3">
                    <i class="fas fa-shopping-bag me-1"></i> Cart
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- কার্ট কনটেন্ট -->
    <div class="container my-5 flex-grow-1">
        <h2 class="mb-4">
            <i class="fas fa-shopping-bag text-primary"></i> Shopping Cart
        </h2>

        <div class="row">
            <!-- বাম পাশে আইটেম টেবিল -->
            <div class="col-lg-8 mb-4">
                <div class="table-responsive bg-white border rounded p-3">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items">
                            <!-- এখানে JavaScript দিয়ে আইটেমগুলো বসবে -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ডান পাশে Order Summary -->
            <div class="col-lg-4">
                <div class="card border">
                    <div class="card-body">
                        <h5 class="card-title border-bottom pb-3 mb-4">Order Summary</h5>

                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Subtotal</span>
                            <span id="subtotal">৳ 0</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Delivery Charge</span>
                            <span id="delivery-charge">৳ 150</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">
                            <strong class="fs-5">Total Amount</strong>
                            <strong class="text-danger fs-5" id="total-amount">৳ 0</strong>
                        </div>

                        <!-- কাস্টমারের তথ্য -->
                        <div class="bg-light p-3 rounded mb-4 border">
                            <h6 class="mb-3">Customer Information</h6>
                            <div class="mb-2">
                                <input type="text" id="customer-name" class="form-control" placeholder="Your Name" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" id="customer-phone" class="form-control" placeholder="Phone Number" required>
                            </div>
                            <!-- Note: নতুন এড্রেস ফিল্ড যোগ করা হয়েছে -->
                            <div class="mb-2">
                                <textarea id="customer-address" class="form-control" placeholder="Delivery Address" rows="2" required></textarea>
                            </div>
                        </div>

                        <button id="checkout-btn" class="btn btn-success w-100 btn-lg">
                            <i class="fas fa-check-circle"></i> Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-secondary text-center py-2 mt-auto">
    <div class="container text-white">
        <div class="d-flex justify-content-center align-items-center gap-2">
            <strong>Proprietor:</strong>
            <img src="images/amin.gif" 
                 alt="Aminul Islam" 
                 style="height: 28px; width: 188px; object-fit: cover; border-radius: 50%;">
        </div>
    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ========== এই পেজের JavaScript ========== -->
    <script>
        // Note: LocalStorage থেকে কার্ট লোড
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Note: পুরো কার্ট আপডেট করার মেইন ফাংশন
        function updateCartUI() {
            // Navbar এর ব্যাজ আপডেট
            const cartCountElement = document.getElementById('cart-count');
            if (cartCountElement) {
                let totalItems = 0;
                for (let i = 0; i < cart.length; i++) {
                    totalItems = totalItems + cart[i].quantity;
                }
                cartCountElement.innerText = totalItems;
            }

            const cartItemsElement = document.getElementById('cart-items');
            
            if (cartItemsElement) {
                cartItemsElement.innerHTML = "";   // আগে খালি করে দাও
                
                let subtotal = 0;
                const deliveryCharge = 150;

                // যদি কার্ট খালি থাকে
                if (cart.length === 0) {
                    cartItemsElement.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">
                                Your cart is empty. Please add some products.
                            </td>
                        </tr>
                    `;
                    
                    document.getElementById('subtotal').innerText = "৳ 0";
                    document.getElementById('total-amount').innerText = "৳ 0";
                    document.getElementById('delivery-charge').innerText = "৳ 0";
                    return;
                }

                document.getElementById('delivery-charge').innerText = "৳ " + deliveryCharge;

                // প্রতিটা আইটেমের জন্য রো তৈরি করা
                for (let i = 0; i < cart.length; i++) {
                    const item = cart[i];
                    const itemTotal = item.price * item.quantity;
                    subtotal = subtotal + itemTotal;

                    const row = `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="${item.img}" width="50" class="rounded me-3" alt="${item.name}">
                                    <h6 class="mb-0">${item.name}</h6>
                                </div>
                            </td>
                            <td>৳ ${item.price}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${i}, -1)">-</button>
                                    <span class="mx-3 fw-bold">${item.quantity}</span>
                                    <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQuantity(${i}, 1)">+</button>
                                </div>
                            </td>
                            <td class="fw-bold">৳ ${itemTotal}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="removeItem(${i})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    
                    cartItemsElement.innerHTML += row;
                }

                // সাবটোটাল ও টোটাল দেখানো
                document.getElementById('subtotal').innerText = "৳ " + subtotal;
                document.getElementById('total-amount').innerText = "৳ " + (subtotal + deliveryCharge);
            }
        }

        // Note: Quantity বাড়ানো বা কমানো
        function changeQuantity(index, amount) {
            cart[index].quantity = cart[index].quantity + amount;

            // যদি ০ বা কম হয়ে যায় তাহলে ডিলিট করে দাও
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        // Note: আইটেম মুছে ফেলা
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        // Note: Checkout বাটনে ক্লিক করলে WhatsApp এ অর্ডার পাঠানো
        document.getElementById('checkout-btn').addEventListener('click', function() {
            if (cart.length === 0) {
                alert("Your cart is empty! Please add products first.");
                return;
            }

            // Note: নাম, ফোন নাম্বার এবং নতুন এড্রেস ফিল্ড থেকে ডেটা নেওয়া হচ্ছে
            const customerName = document.getElementById('customer-name').value.trim();
            const customerPhone = document.getElementById('customer-phone').value.trim();
            const customerAddress = document.getElementById('customer-address').value.trim();

            // Note: চেক করা হচ্ছে সব ফিল্ড পূরণ করা হয়েছে কি না
            if (customerName === "" || customerPhone === "" || customerAddress === "") {
                alert("Please enter your Name, Phone Number, and Address.");
                return;
            }

            // WhatsApp মেসেজ তৈরি করা
            let message = "*New Order from AZ Solution*\n\n";
            message += "*Customer Details:*\n";
            message += "Name: " + customerName + "\n";
            message += "Phone: " + customerPhone + "\n";
            message += "Address: " + customerAddress + "\n\n"; // Note: মেসেজে এড্রেস যোগ করা হয়েছে
            message += "*Order Items:*\n";

            let subtotal = 0;

            for (let i = 0; i < cart.length; i++) {
                const item = cart[i];
                const itemTotal = item.price * item.quantity;
                subtotal = subtotal + itemTotal;
                
                message += (i + 1) + ". " + item.name + " - " + item.quantity + " pcs (৳ " + itemTotal + ")\n";
            }

            const deliveryCharge = 150;
            const totalAmount = subtotal + deliveryCharge;

            message += "\nSubtotal: ৳ " + subtotal + "\n";
            message += "Delivery: ৳ " + deliveryCharge + "\n";
            message += "*Total Amount: ৳ " + totalAmount + "*\n\n";
            message += "Please confirm my order.";

            // WhatsApp লিংক তৈরি করে নতুন ট্যাবে খোলা
            const whatsappNumber = "8801871122883";
            const whatsappURL = "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message);

            window.open(whatsappURL, "_blank");

            // অর্ডার হয়ে গেলে কার্ট খালি করে দেওয়া
            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));

            // Note: ইনপুট ফিল্ডগুলো পরিষ্কার করে দেওয়া
            document.getElementById('customer-name').value = "";
            document.getElementById('customer-phone').value = "";
            document.getElementById('customer-address').value = "";

            updateCartUI();
        });

        // Note: পেজ লোড হলে কার্ট দেখাও
        document.addEventListener('DOMContentLoaded', function() {
            updateCartUI();
        });
    </script>
</body>
</html>
